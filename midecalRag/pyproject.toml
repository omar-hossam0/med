[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# verify scripts import the app after a sys.path fix and deliberately swallow
# teardown errors; the pytest subprocess return code is inspected by hand.
"scripts/*" = ["E402", "B904"]
"tests/*" = ["E402"]
